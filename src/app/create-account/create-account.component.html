<p class="title">Administración de cuentas</p>

  <div class="form-group">
    <label for="customerSelect">Cliente:</label>
    <select id="customerSelect" #customerSelect (change)="obtenerCuentas(customerSelect.value)" class="form-control">
      <option value="" disabled selected>Seleccione un cliente</option>
      <option *ngFor="let item of dataCustomers" [value]="item.id">{{ item.name }}</option>
    </select>
  </div>


<table class="styled-table">
  <thead>
    <tr>
      <th scope="col">Número</th>
      <th scope="col">Tipo</th>
      <th scope="col">Saldo</th>
    </tr>
  </thead>
  <tbody>
    @for (data of dataAccounts; track $index) {
        <tr>
            <td> {{data.number }}</td>
            <td> {{data.type }}</td>
            <td> {{data.balance }}</td>
        </tr>
        }
  </tbody>
</table>
