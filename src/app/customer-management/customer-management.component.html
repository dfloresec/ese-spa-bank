<p class="title">Administración de clientes</p>

<!-- Botón para mostrar el formulario -->
<div class="button-group">
  <button class="btn btn-primary" (click)="toggleForm()">Agregar Cliente</button>
</div>

<!-- Formulario de ingreso de datos -->
<form *ngIf="showForm" (ngSubmit)="onSubmit()" class="form-container">
  <div class="form-group">
    <label for="name">Nombre:</label>
    <input id="name" type="text" [(ngModel)]="customer.name" name="name" class="form-control" required />
  </div>
  <div class="form-group">
    <label for="gender">Género:</label>
    <select id="gender" [(ngModel)]="customer.gender" name="gender" class="form-control" required>
      <option value="" disabled selected>Seleccione un género</option>
      <option value="M">Masculino</option>
      <option value="F">Femenino</option>
    </select>
  </div>
  <div class="form-group">
    <label for="age">Edad:</label>
    <input id="age" type="number" [(ngModel)]="customer.age" name="age" class="form-control" required />
  </div>
  <div class="form-group">
    <label for="identification">Identificación:</label>
    <input id="identification" type="text" [(ngModel)]="customer.identification" name="identification" class="form-control" required />
  </div>
  <div class="form-group">
    <label for="address">Dirección:</label>
    <input id="address" type="text" [(ngModel)]="customer.address" name="address" class="form-control" required />
  </div>
  <div class="form-group">
    <label for="phone">Teléfono:</label>
    <input id="phone" type="text" [(ngModel)]="customer.phone" name="phone" class="form-control" required />
  </div>
  <div class="form-group">
    <label for="password">Contraseña:</label>
    <input id="password" type="password" [(ngModel)]="customer.password" name="password" class="form-control" required />
  </div>
  <div class="form-group">
    <label for="state">Estado:</label>
    <select id="state" [(ngModel)]="customer.state" name="state" class="form-control" required>
      <option [value]="true">Activo</option>
      <option [value]="false">Inactivo</option>
    </select>
  </div>
  <div class="button-group">
    <button type="submit" class="btn btn-primary">Guardar</button>
    <button type="button" class="btn btn-secondary" (click)="toggleForm()">Cancelar</button>
  </div>
</form>

<!-- Tabla con opciones de edición y eliminación -->
<table class="styled-table">
  <thead>
    <tr>
      <th scope="col">Código</th>
      <th scope="col">Nombre</th>
      <th scope="col">Identificación</th>
      <th scope="col">Teléfono</th>
      <th scope="col">Acciones</th>
    </tr>
  </thead>
  <tbody>
    <tr *ngFor="let data of dataCustomers; index as i">
      <td>{{ data.id }}</td>
      <td>{{ data.name }}</td>
      <td>{{ data.identification }}</td>
      <td>{{ data.phone }}</td>
      <td>
        <button class="btn btn-secondary" (click)="onEdit(data)">Editar</button>
        <button class="btn btn-danger" (click)="onDelete(data.id)">Eliminar</button>
      </td>
    </tr>
  </tbody>
</table>
