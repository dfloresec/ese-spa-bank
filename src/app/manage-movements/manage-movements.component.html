<p class="title">Movimientos</p>
<form (ngSubmit)="onSubmit()" class="form-container">
  <div class="form-group">
    <label for="customerSelect">Cliente:</label>
    <select id="customerSelect" #customerSelect (change)="obtenerCuentas(customerSelect.value)" class="form-control">
      <option value="" disabled selected>Seleccione un cliente</option>
      <option *ngFor="let item of dataCustomers" [value]="item.id">{{ item.name }}</option>
    </select>
  </div>
  <div class="form-group">
    <label for="accountSelect">Cuenta:</label>
    <select id="accountSelect" [(ngModel)]="selectedAccountId" name="selectedAccountId" class="form-control" required>
      <option value="" disabled selected>Seleccione una cuenta</option>
      <option *ngFor="let item of dataAccounts" [value]="item.id">{{ item.number }} - {{ item.type }}</option>
    </select>
  </div>
  <div class="form-group">
    <label for="valuee">Valor del movimiento:</label>
    <input
      id="valuee"
      type="number"
      placeholder="Ingrese el valor del movimiento"
      name="movementValue"
      [(ngModel)]="movementValue"
      class="form-control"
      required
    />
  </div>
  <div class="button-group">
    <button type="submit" class="btn btn-primary">Registrar movimiento</button>
    <button type="reset" class="btn btn-secondary">Nuevo movimiento</button>
  </div>
</form>
