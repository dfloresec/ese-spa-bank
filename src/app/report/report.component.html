<p class="title">Reporte de movimientos por cuenta</p>

<form (ngSubmit)="onGenerateReport()" class="form-container">
  <div class="form-group">
    <label for="customerSelect">Cliente:</label>
    <select id="customerSelect" [(ngModel)]="selectedCustomerId" name="selectedCustomerId" (change)="onCustomerChange()" class="form-control" required>
      <option value="" disabled selected>Seleccione un cliente</option>
      <option *ngFor="let customer of dataCustomers" [value]="customer.id">{{ customer.name }}</option>
    </select>
  </div>

  <div class="form-group">
    <label for="accountSelect">Cuenta:</label>
    <select id="accountSelect" [(ngModel)]="selectedAccountId" name="selectedAccountId" class="form-control" required>
      <option value="" disabled selected>Seleccione una cuenta</option>
      <option *ngFor="let account of dataAccounts" [value]="account.id">{{ account.number }} - {{ account.type }}</option>
    </select>
  </div>

  <div class="form-group">
    <label for="startDate">Fecha de inicio:</label>
    <input id="startDate" type="date" [(ngModel)]="startDate" name="startDate" class="form-control" required />
  </div>

  <div class="form-group">
    <label for="endDate">Fecha de fin:</label>
    <input id="endDate" type="date" [(ngModel)]="endDate" name="endDate" class="form-control" required />
  </div>

  <div class="button-group">
    <button type="submit" class="btn btn-primary">Generar reporte</button>
  </div>
</form>

<table class="styled-table" *ngIf="dataMovements.length > 0">
  <thead>
    <tr>
      <th>#</th>
      <th>Fecha</th>
      <th>Monto</th>
    </tr>
  </thead>
  <tbody>
    <tr *ngFor="let movement of dataMovements; index as i">
      <td>{{ i + 1 }}</td>
      <td>{{ movement.createDate | date: 'dd/MM/yyyy HH:mm:ss' }}</td>   
      <td>{{ movement.valuee }}</td>
    </tr>
  </tbody>
</table>
